name: Embed Shopify YouTube demos

on:
  workflow_dispatch:
  push:
    branches: [cursor/shopify-youtube-demo-embeds-20260923]
    paths:
      - ".github/workflows/embed-youtube-demos.yml"
      - "assets/js/shopify-guide-youtube-demos.js"

permissions:
  contents: write

jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/shopify-youtube-demo-embeds-20260923
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Insert demo injector script tags and fix address-guard escapes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          files = [
            "guides/block-po-box-billing-address/index.html",
            "guides/prop-65-product-page-warning-2028/index.html",
            "guides/access-audit-shopify-admin/index.html",
            "guides/b2b-po-number-required/index.html",
            "guides/agentic-catalog-readiness/index.html",
            "guides/eu-generic-green-claims-ban/index.html",
            "guides/eudr-dds-lot-registry/index.html",
            "guides/clp-hazard-product-page/index.html",
            "guides/textile-fibre-label-eu/index.html",
            "guides/fic-food-allergen-label/index.html",
          ]
          script = '  <script src="/assets/js/shopify-guide-youtube-demos.js" defer></script>\n'
          def fix_literal_escapes(s: str) -> str:
              return re.sub(r'\\u([0-9a-fA-F]{4})', lambda m: chr(int(m.group(1), 16)), s)
          for path in files:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              text2 = fix_literal_escapes(text)
              if "shopify-guide-youtube-demos.js" not in text2:
                  if "</body>" not in text2:
                      raise SystemExit(f"no </body> in {path}")
                  text2 = text2.replace("</body>", script + "</body>", 1)
                  print("patched", path)
              elif text2 != text:
                  print("fixed escapes", path)
              else:
                  print("skip", path)
              if text2 != text:
                  p.write_text(text2, encoding="utf-8")
          PY
      - name: Commit and push
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add guides
            git commit -m "Load YouTube demo injector on 10 Shopify challenge guides"
            git push origin HEAD:cursor/shopify-youtube-demo-embeds-20260923
          else
            echo "No guide changes to commit"
          fi
