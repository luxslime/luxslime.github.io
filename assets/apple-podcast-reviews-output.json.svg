<svg xmlns="http://www.w3.org/2000/svg" width="720" height="252" viewBox="0 0 720 252" role="img" aria-label="Apple Podcasts Reviews Scraper sample output row">
  <title>Apple Podcasts Reviews Scraper sample output row</title>
  <defs>
    <style>
      .bg { fill: #f6f8fa; }
      .border { fill: none; stroke: #d0d7de; stroke-width: 1; }
      .text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 14px; }
      .brace { fill: #24292f; }
      .key { fill: #0550ae; }
      .string { fill: #0a3069; }
      .number { fill: #0550ae; }
    </style>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="719" height="251" rx="8"/>
  <rect class="border" x="0.5" y="0.5" width="719" height="251" rx="8"/>
  <text class="text" x="20" y="36">
    <tspan class="brace">{</tspan>
  </text>
  <text class="text" x="36" y="60">
    <tspan class="key">"rowType"</tspan><tspan class="brace">: </tspan><tspan class="string">"podcast_review"</tspan><tspan class="brace">,</tspan>
  </text>
  <text class="text" x="36" y="84">
    <tspan class="key">"podcastId"</tspan><tspan class="brace">: </tspan><tspan class="string">"1535809341"</tspan><tspan class="brace">,</tspan>
  </text>
  <text class="text" x="36" y="108">
    <tspan class="key">"country"</tspan><tspan class="brace">: </tspan><tspan class="string">"us"</tspan><tspan class="brace">,</tspan>
  </text>
  <text class="text" x="36" y="132">
    <tspan class="key">"rating"</tspan><tspan class="brace">: </tspan><tspan class="number">1</tspan><tspan class="brace">,</tspan>
  </text>
  <text class="text" x="36" y="156">
    <tspan class="key">"title"</tspan><tspan class="brace">: </tspan><tspan class="string">"A critical review"</tspan><tspan class="brace">,</tspan>
  </text>
  <text class="text" x="36" y="180">
    <tspan class="key">"reviewerName"</tspan><tspan class="brace">: </tspan><tspan class="string">"public-reviewer"</tspan><tspan class="brace">,</tspan>
  </text>
  <text class="text" x="36" y="204">
    <tspan class="key">"sourceUrl"</tspan><tspan class="brace">: </tspan><tspan class="string">"https://itunes.apple.com/us/rss/customerreviews/id=1535809341/sortby=mostrecent/json"</tspan>
  </text>
  <text class="text" x="20" y="228">
    <tspan class="brace">}</tspan>
  </text>
</svg>
