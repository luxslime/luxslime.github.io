<svg xmlns="http://www.w3.org/2000/svg" width="720" height="88" viewBox="0 0 720 88" role="img" aria-label="Article Content Extractor input JSON example">
  <title>Article Content Extractor input JSON</title>
  <defs>
    <style>
      .bg { fill: #f6f8fa; }
      .border { fill: none; stroke: #d0d7de; stroke-width: 1; }
      .text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 14px; }
      .brace { fill: #24292f; }
      .key { fill: #0550ae; }
      .string { fill: #0a3069; }
      .bool { fill: #cf222e; }
    </style>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="719" height="87" rx="8"/>
  <rect class="border" x="0.5" y="0.5" width="719" height="87" rx="8"/>
  <text class="text" x="20" y="54">
    <tspan class="brace">{</tspan><tspan class="key">"urls"</tspan><tspan class="brace">:[</tspan><tspan class="string">"https://example.com/news/example"</tspan><tspan class="brace">],</tspan><tspan class="key">"includeImages"</tspan><tspan class="brace">:</tspan><tspan class="bool">false</tspan><tspan class="brace">,</tspan><tspan class="key">"delivery"</tspan><tspan class="brace">:</tspan><tspan class="string">"dataset"</tspan><tspan class="brace">,</tspan><tspan class="key">"dryRun"</tspan><tspan class="brace">:</tspan><tspan class="bool">false</tspan><tspan class="brace">}</tspan>
  </text>
</svg>
