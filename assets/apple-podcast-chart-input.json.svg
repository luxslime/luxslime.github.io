<svg xmlns="http://www.w3.org/2000/svg" width="720" height="204" viewBox="0 0 720 204" role="img" aria-label="Apple Podcasts Chart Scraper input JSON example">
  <title>Apple Podcasts Chart Scraper input JSON</title>
  <defs>
    <style>
      .bg { fill: #f6f8fa; }
      .border { fill: none; stroke: #d0d7de; stroke-width: 1; }
      .text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 14px; }
      .brace { fill: #24292f; }
      .key { fill: #0550ae; }
      .string { fill: #0a3069; }
      .number { fill: #0550ae; }
      .bool { fill: #cf222e; }
    </style>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="719" height="203" rx="8"/>
  <rect class="border" x="0.5" y="0.5" width="719" height="203" rx="8"/>
  <text class="text" x="20" y="36">
    <tspan class="brace">{</tspan>
  </text>
  <text class="text" x="36" y="60">
    <tspan class="key">"countries"</tspan><tspan class="brace">: [</tspan><tspan class="string">"us"</tspan><tspan class="brace">],</tspan>
  </text>
  <text class="text" x="36" y="84">
    <tspan class="key">"limit"</tspan><tspan class="brace">: </tspan><tspan class="number">25</tspan><tspan class="brace">,</tspan>
  </text>
  <text class="text" x="36" y="108">
    <tspan class="key">"delivery"</tspan><tspan class="brace">: </tspan><tspan class="string">"dataset"</tspan><tspan class="brace">,</tspan>
  </text>
  <text class="text" x="36" y="132">
    <tspan class="key">"dryRun"</tspan><tspan class="brace">: </tspan><tspan class="bool">false</tspan>
  </text>
  <text class="text" x="20" y="156">
    <tspan class="brace">}</tspan>
  </text>
</svg>
