<svg xmlns="http://www.w3.org/2000/svg" width="720" height="228" viewBox="0 0 720 228" role="img" aria-label="G2 reviews scraper sample output row">
  <title>G2 reviews scraper sample output row</title>
  <defs>
    <style>
      .bg { fill: #f6f8fa; }
      .border { fill: none; stroke: #d0d7de; stroke-width: 1; }
      .text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 14px; }
      .brace { fill: #24292f; }
      .key { fill: #0550ae; }
      .string { fill: #0a3069; }
      .number { fill: #0550ae; }
    </style>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="719" height="227" rx="8"/>
  <rect class="border" x="0.5" y="0.5" width="719" height="227" rx="8"/>
  <text class="text" x="20" y="36">
    <tspan class="brace">{</tspan>
  </text>
  <text class="text" x="36" y="60">
    <tspan class="key">"source"</tspan><tspan class="brace">: </tspan><tspan class="string">"g2"</tspan><tspan class="brace">,</tspan>
  </text>
  <text class="text" x="36" y="84">
    <tspan class="key">"status"</tspan><tspan class="brace">: </tspan><tspan class="string">"ok"</tspan><tspan class="brace">,</tspan>
  </text>
  <text class="text" x="36" y="108">
    <tspan class="key">"sourceUrl"</tspan><tspan class="brace">: </tspan><tspan class="string">"https://www.g2.com/products/notion/reviews"</tspan><tspan class="brace">,</tspan>
  </text>
  <text class="text" x="36" y="132">
    <tspan class="key">"productName"</tspan><tspan class="brace">: </tspan><tspan class="string">"Notion"</tspan><tspan class="brace">,</tspan>
  </text>
  <text class="text" x="36" y="156">
    <tspan class="key">"overallRating"</tspan><tspan class="brace">: </tspan><tspan class="number">4.5</tspan><tspan class="brace">,</tspan>
  </text>
  <text class="text" x="36" y="180">
    <tspan class="key">"totalReviewCount"</tspan><tspan class="brace">: </tspan><tspan class="number">4321</tspan>
  </text>
  <text class="text" x="20" y="204">
    <tspan class="brace">}</tspan>
  </text>
</svg>
